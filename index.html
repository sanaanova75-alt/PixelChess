
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelChess</title>

<style>
body {
  background: #202020;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: white;
  letter-spacing: 4px;
}

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: min(90vw, 480px);
  aspect-ratio: 1;
  margin: 25px auto;
  border: 4px solid #111;
}

.square {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(22px, 7vw, 48px);
  cursor: pointer;
}

.light { background: #dddddd; }
.dark { background: #777777; }

.white { color: white; }
.black { color: black; }
</style>
</head>

<body>

<h1>PIXEL CHESS</h1>
<p>Welcome to PixelChess!</p>

<div id="board"></div>

<script>
const pieces = [
  "♜","♞","♝","♛","♚","♝","♞","♜",
  "♟","♟","♟","♟","♟","♟","♟","♟",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "♙","♙","♙","♙","♙","♙","♙","♙",
  "♖","♘","♗","♕","♔","♗","♘","♖"
];

const board = document.getElementById("board");

for (let i = 0; i < 64; i++) {
  const square = document.createElement("div");

  square.className =
    "square " + 
    ((Math.floor(i / 8) + i % 8) % 2
      ? "dark" : "light");

  const piece = pieces[i];

  if (piece) {
    square.textContent = piece;
    square.classList.add(i < 16 ? "black" : "white");
  }

  board.appendChild(square);
}
</script>

</body>
</html>
